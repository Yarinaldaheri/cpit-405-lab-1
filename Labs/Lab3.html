<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 3</title>
  <style>
    .image-preview img {
      border-top: 30px solid skyblue;
      border-right: 30px solid lightpink;
      border-bottom: 30px solid lightgreen;
      border-left: 30px solid #ffefd5;
    }
    p > span {
      color: red;
    }
    #header span {
      color: pink;
    }
    span {
      color: green;
    }
    #header *:last-child {
      color: orange;
    }
    #header span:first-child:hover {
      color: blue;
    }
    table {
      border-collapse: collapse;
    }
    th,
    td {
      border: 1px solid black;
      padding: 10px;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>Lab 3</h1>
  <h2>Question 1</h2>
  <div class="image-preview">
    <img
      src="https://cpit405.gitlab.io/images/KAU_logo.png"
      alt="KAU logo"
    >
  </div>
  <hr>
  <h2>Question 2</h2>
  <div id="header">
    <span class="myclass1">Every</span>
    <span class="myclass2">one can</span>
    <span class="myclass3">success.</span>
  </div>
  <p>
    One machine can do the work of fifty ordinary men.
    <span class="myclass4">No machine can do the work of one extraordinary man.</span>
  </p>
  <table>
    <tr>
      <th></th>
      <th>color</th>
      <th>color when mouse over</th>
    </tr>
    <tr>
      <th>span.myclass1</th>
      <td>pink</td>
      <td>blue</td>
    </tr>
    <tr>
      <th>span.myclass2</th>
      <td>pink</td>
      <td>pink</td>
    </tr>
    <tr>
      <th>span.myclass3</th>
      <td>orange</td>
      <td>orange</td>
    </tr>
    <tr>
      <th>span.myclass4</th>
      <td>red</td>
      <td>red</td>
    </tr>
  </table>
</body>
</html>
